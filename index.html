<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITDI Fund Management</title>
    <!-- Tailwind CSS (พื้นฐาน) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js (คุมระบบ) -->
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@100;300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Anuphan', sans-serif; }
        /* คุณสามารถเขียน CSS ของคุณเองเพิ่มตรงนี้ได้เลย */
    </style>
</head>
<body x-data="itdiApp()" class="bg-slate-50 dark:bg-slate-950 transition-colors duration-300" :class="{ 'dark': isDarkMode }">

    <!-- Loading Screen -->
    <div x-show="loading" class="fixed inset-0 z-[100] flex flex-col items-center justify-center bg-white dark:bg-slate-950">
        <div class="w-16 h-16 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
        <p class="mt-4 font-bold text-slate-400 animate-pulse">กำลังโหลดระบบ ITDI FUND...</p>
    </div>

    <!-- Login Screen -->
    <template x-if="!userData">
        <div class="min-h-screen flex items-center justify-center p-6 bg-slate-50 dark:bg-slate-950 relative overflow-hidden">
            <div class="absolute top-0 left-0 w-96 h-96 bg-blue-500/10 rounded-full blur-[100px]"></div>
            <div class="w-full max-w-md bg-white dark:bg-slate-900 p-10 rounded-[2.5rem] shadow-2xl relative">
                <div class="text-center mb-10">
                    <div class="inline-flex p-5 bg-blue-600 rounded-2xl text-white mb-6 shadow-xl shadow-blue-500/30">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-10 h-10" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" /></svg>
                    </div>
                    <h1 class="text-3xl font-black tracking-tighter">ITDI FUND</h1>
                    <p class="text-slate-400 text-sm mt-2">ลงชื่อเข้าใช้ด้วยรหัสนักศึกษา</p>
                </div>
                <form @submit.prevent="login()">
                    <input type="text" x-model="loginInput" placeholder="รหัสนักศึกษา..." class="w-full px-6 py-4 rounded-2xl border border-slate-200 dark:border-slate-800 dark:bg-slate-950 mb-4 focus:ring-4 focus:ring-blue-500/10 outline-none font-bold">
                    <button class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-4 rounded-2xl shadow-xl shadow-blue-500/30 transition-all active:scale-95">เข้าสู่ระบบ</button>
                </form>
            </div>
        </div>
    </template>

    <!-- Main Content -->
    <template x-if="userData">
        <div class="flex min-h-screen">
            <!-- Sidebar -->
            <aside class="fixed inset-y-0 left-0 z-50 w-72 bg-white dark:bg-slate-900 border-r border-slate-100 dark:border-slate-800 transition-transform lg:translate-x-0" :class="isSidebarOpen ? 'translate-x-0' : '-translate-x-full'">
                <div class="p-8 h-full flex flex-col">
                    <div class="flex items-center gap-4 mb-10">
                        <div class="p-2 bg-blue-600 rounded-xl text-white shadow-lg shadow-blue-500/30"><svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg></div>
                        <span class="font-black text-xl tracking-tighter">ITDI FUND</span>
                        <button @click="isSidebarOpen = false" class="lg:hidden ml-auto text-slate-400"><svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg></button>
                    </div>

                    <nav class="space-y-2 flex-1">
                        <button @click="activeTab = 'dashboard'; isSidebarOpen = false" :class="activeTab === 'dashboard' ? 'bg-blue-600 text-white shadow-lg shadow-blue-500/30' : 'text-slate-500 hover:bg-slate-50 dark:hover:bg-slate-800'" class="w-full flex items-center gap-4 px-5 py-4 rounded-2xl font-bold transition-all">แดชบอร์ด</button>
                        <button @click="activeTab = 'history'; isSidebarOpen = false" :class="activeTab === 'history' ? 'bg-blue-600 text-white shadow-lg shadow-blue-500/30' : 'text-slate-500 hover:bg-slate-50 dark:hover:bg-slate-800'" class="w-full flex items-center gap-4 px-5 py-4 rounded-2xl font-bold transition-all">ประวัติของฉัน</button>
                        <button @click="activeTab = 'ledger'; isSidebarOpen = false" :class="activeTab === 'ledger' ? 'bg-blue-600 text-white shadow-lg shadow-blue-500/30' : 'text-slate-500 hover:bg-slate-50 dark:hover:bg-slate-800'" class="w-full flex items-center gap-4 px-5 py-4 rounded-2xl font-bold transition-all">บัญชีกลาง</button>
                        <button x-show="userData.role === 'admin'" @click="activeTab = 'admin'; isSidebarOpen = false" :class="activeTab === 'admin' ? 'bg-blue-600 text-white shadow-lg shadow-blue-500/30' : 'text-slate-500 hover:bg-slate-50 dark:hover:bg-slate-800'" class="w-full flex items-center gap-4 px-5 py-4 rounded-2xl font-bold transition-all text-purple-600 dark:text-purple-400">ระบบแอดมิน</button>
                    </nav>

                    <div class="mt-auto pt-8 border-t border-slate-100 dark:border-slate-800 space-y-6">
                        <div class="flex items-center gap-4 px-2">
                            <div class="w-12 h-12 rounded-2xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center font-bold text-blue-500" x-text="userData.studentId.slice(-3)"></div>
                            <div class="overflow-hidden">
                                <p class="text-sm font-black truncate" x-text="userData.studentId"></p>
                                <p class="text-[10px] uppercase font-bold text-slate-400 tracking-widest" x-text="userData.role"></p>
                            </div>
                        </div>
                        <div class="flex gap-2">
                            <button @click="isDarkMode = !isDarkMode" class="flex-1 p-3 rounded-xl bg-slate-100 dark:bg-slate-800 flex justify-center"><svg x-show="!isDarkMode" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg><svg x-show="isDarkMode" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-amber-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg></button>
                            <button @click="logout()" class="flex-1 p-3 rounded-xl bg-rose-50 dark:bg-rose-900/20 text-rose-500 flex justify-center"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg></button>
                        </div>
                    </div>
                </div>
            </aside>

            <!-- Main Panel -->
            <main class="flex-1 lg:ml-72 p-6 lg:p-12">
                <!-- Mobile Header -->
                <header class="flex lg:hidden items-center justify-between mb-8">
                    <button @click="isSidebarOpen = true" class="p-3 bg-white dark:bg-slate-900 rounded-xl shadow-sm border border-slate-100 dark:border-slate-800"><svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" /></svg></button>
                    <span class="font-black text-xl">ITDI FUND</span>
                    <div class="w-10"></div>
                </header>

                <div class="max-w-6xl mx-auto space-y-12">
                    
                    <!-- Dashboard Section -->
                    <section x-show="activeTab === 'dashboard'" class="space-y-10 animate-in fade-in slide-in-from-bottom-4 duration-500">
                        <div class="flex justify-between items-end">
                            <div>
                                <h2 class="text-4xl font-black italic">แดชบอร์ด</h2>
                                <p class="text-slate-400 font-bold uppercase text-[10px] tracking-widest mt-2">สัปดาห์ที่เก็บเงินปัจจุบัน: <span class="text-blue-500" x-text="config.currentWeek"></span></p>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                            <div class="p-10 bg-gradient-to-br from-blue-600 to-indigo-800 text-white rounded-[2.5rem] shadow-2xl shadow-blue-500/40">
                                <p class="text-blue-200 text-xs font-black uppercase tracking-[0.2em] mb-3">ยอดสะสมของคุณ</p>
                                <div class="flex items-baseline gap-2">
                                    <h3 class="text-6xl font-black" x-text="getMyTotal().toLocaleString()"></h3>
                                    <span class="text-xl font-bold opacity-40">฿</span>
                                </div>
                            </div>
                            <div class="p-10 bg-white dark:bg-slate-900 rounded-[2.5rem] shadow-xl border border-slate-100 dark:border-slate-800">
                                <p class="text-slate-400 text-xs font-black uppercase tracking-[0.2em] mb-3">เงินกองกลางคงเหลือ</p>
                                <div class="flex items-baseline gap-2">
                                    <h3 class="text-6xl font-black text-emerald-500" x-text="getTotalBalance().toLocaleString()"></h3>
                                    <span class="text-xl font-bold text-slate-300">฿</span>
                                </div>
                            </div>
                            <div class="p-10 bg-white dark:bg-slate-900 rounded-[2.5rem] shadow-xl border border-slate-100 dark:border-slate-800">
                                <p class="text-slate-400 text-xs font-black uppercase tracking-[0.2em] mb-3">ค้างชำระ</p>
                                <div class="flex items-baseline gap-2">
                                    <h3 class="text-6xl font-black text-rose-500" x-text="Math.max(0, (config.currentWeek * 30) - getMyTotal()).toLocaleString()"></h3>
                                    <span class="text-xl font-bold text-slate-300">฿</span>
                                </div>
                            </div>
                        </div>
                    </section>

                    <!-- History Section -->
                    <section x-show="activeTab === 'history'" class="space-y-6">
                        <h2 class="text-3xl font-black italic">ประวัติของฉัน</h2>
                        <div class="bg-white dark:bg-slate-900 rounded-[2rem] shadow-xl overflow-hidden border border-slate-100 dark:border-slate-800">
                            <table class="w-full text-left">
                                <thead class="bg-slate-50 dark:bg-slate-800/50 text-[10px] font-black uppercase tracking-widest text-slate-400">
                                    <tr>
                                        <th class="px-8 py-5">วัน/เวลา</th>
                                        <th class="px-8 py-5">สัปดาห์</th>
                                        <th class="px-8 py-5">ยอดโอน</th>
                                        <th class="px-8 py-5 text-right">สถานะ</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100 dark:divide-slate-800">
                                    <template x-for="t in transactions.filter(tr => tr.studentId === userData.studentId)">
                                        <tr class="hover:bg-slate-50 dark:hover:bg-slate-800/30 transition-colors">
                                            <td class="px-8 py-5 text-sm font-medium text-slate-500" x-text="t.ประทับเวลา"></td>
                                            <td class="px-8 py-5 font-bold" x-text="'วีค ' + t.week"></td>
                                            <td class="px-8 py-5 font-black text-blue-600" x-text="'+' + t.amount + ' ฿'"></td>
                                            <td class="px-8 py-5 text-right">
                                                <span class="px-3 py-1 rounded-full text-[10px] font-black uppercase" :class="t.status === 'Approved' ? 'bg-emerald-100 text-emerald-600' : 'bg-amber-100 text-amber-600'" x-text="t.status"></span>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </section>

                    <!-- Ledger Section -->
                    <section x-show="activeTab === 'ledger'" class="space-y-6">
                        <h2 class="text-3xl font-black italic">บัญชีกลาง</h2>
                        <div class="bg-white dark:bg-slate-900 rounded-[2rem] shadow-xl overflow-hidden border border-slate-100 dark:border-slate-800">
                            <table class="w-full text-left">
                                <thead class="bg-slate-50 dark:bg-slate-800/50 text-[10px] font-black uppercase tracking-widest text-slate-400">
                                    <tr>
                                        <th class="px-8 py-5">วันที่</th>
                                        <th class="px-8 py-5">รายการ</th>
                                        <th class="px-8 py-5">รายรับ</th>
                                        <th class="px-8 py-5 text-right">รายจ่าย</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100 dark:divide-slate-800">
                                    <template x-for="l in ledger">
                                        <tr class="hover:bg-slate-50 dark:hover:bg-slate-800/30 transition-colors">
                                            <td class="px-8 py-5 text-sm text-slate-500" x-text="l.Date"></td>
                                            <td class="px-8 py-5 font-bold" x-text="l.Item"></td>
                                            <td class="px-8 py-5 font-black text-emerald-600" x-text="l.Income > 0 ? '+' + l.Income : '-'"></td>
                                            <td class="px-8 py-5 text-right font-black text-rose-600" x-text="l.Expense > 0 ? '-' + l.Expense : '-'"></td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </section>

                    <!-- Admin Section -->
                    <section x-show="activeTab === 'admin' && userData.role === 'admin'" class="space-y-8 animate-in fade-in duration-500">
                        <div class="flex justify-between items-center">
                            <h2 class="text-4xl font-black italic text-purple-600">แอดมิน</h2>
                            <div class="flex items-center gap-4 bg-white dark:bg-slate-900 p-3 rounded-2xl shadow-xl border border-slate-100 dark:border-slate-800">
                                <button @click="updateWeek(-1)" class="p-2 hover:bg-slate-50 dark:hover:bg-slate-800 rounded-xl"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4" /></svg></button>
                                <span class="font-black text-xl" x-text="'อาทิตย์ที่ ' + config.currentWeek"></span>
                                <button @click="updateWeek(1)" class="p-2 hover:bg-slate-50 dark:hover:bg-slate-800 rounded-xl"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg></button>
                            </div>
                        </div>

                        <!-- Waiting List -->
                        <div class="space-y-4">
                            <h3 class="font-black text-slate-400 uppercase text-xs tracking-widest px-2">รายการรอตรวจสอบ</h3>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <template x-for="t in transactions.filter(tr => tr.status === 'Pending')">
                                    <div class="bg-white dark:bg-slate-900 p-6 rounded-[1.5rem] shadow-lg flex justify-between items-center border border-amber-500/20">
                                        <div class="flex items-center gap-4">
                                            <div class="w-12 h-12 rounded-xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center font-bold" x-text="t.studentId.slice(-3)"></div>
                                            <div>
                                                <p class="font-bold" x-text="t.studentId"></p>
                                                <p class="text-xs text-slate-500" x-text="'วีค ' + t.week + ' • ' + t.amount + ' ฿'"></p>
                                            </div>
                                        </div>
                                        <button @click="approve(t)" class="p-3 bg-emerald-500 text-white rounded-xl shadow-lg shadow-emerald-500/30 hover:bg-emerald-600 transition-all"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" /></svg></button>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </section>

                </div>
            </main>
        </div>
    </template>

    <!-- Firebase SDK (Version 11) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, getDoc, updateDoc, onSnapshot, query, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAOXm4aDbToq4ZahlsbgwFz8nfkIviL-bs",
            authDomain: "itdi-fund.firebaseapp.com",
            projectId: "itdi-fund",
            storageBucket: "itdi-fund.firebasestorage.app",
            messagingSenderId: "770219582415",
            appId: "1:770219582415:web:e6c780dd599bb4f7d528ba"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = 'itdi-fund-production';

        window.itdiApp = () => ({
            loading: true,
            isDarkMode: true,
            isSidebarOpen: false,
            activeTab: 'dashboard',
            userData: null,
            loginInput: '',
            config: { currentWeek: 1 },
            students: [],
            transactions: [],
            ledger: [],

            async init() {
                // Auth
                await signInAnonymously(auth);
                onAuthStateChanged(auth, async (u) => {
                    if (u) {
                        // ดึงข้อมูล Real-time
                        this.syncData();
                    } else {
                        this.userData = null;
                        this.loading = false;
                    }
                });
            },

            syncData() {
                // Config
                onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'config'), (s) => {
                    if (s.exists()) this.config = s.data();
                    this.loading = false;
                });
                // Students
                onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'students'), (s) => {
                    this.students = s.docs.map(d => ({ id: d.id, ...d.data() }));
                    // อัปเดตข้อมูลผู้ใช้ถ้าล็อกอินอยู่
                    if (this.userData) {
                        const current = this.students.find(st => st.studentId === this.userData.studentId);
                        if (current) this.userData = current;
                    }
                });
                // Transactions
                onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'transactions'), (s) => {
                    this.transactions = s.docs.map(d => ({ id: d.id, ...d.data() }));
                });
                // Ledger
                onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'ledger'), (s) => {
                    this.ledger = s.docs.map(d => ({ id: d.id, ...d.data() }));
                });
            },

            async login() {
                this.loading = true;
                const sid = this.loginInput.trim();
                const studentRef = doc(db, 'artifacts', appId, 'public', 'data', 'students', sid);
                const snap = await getDoc(studentRef);
                const INITIAL_ADMINS = ['684295024@parichat.skru.ac.th', 'admin'];

                if (snap.exists()) {
                    const data = snap.data();
                    const role = INITIAL_ADMINS.includes(sid) ? 'admin' : (data.role || 'user');
                    await updateDoc(studentRef, { uid: auth.currentUser.uid, role });
                    this.userData = { id: sid, ...data, role };
                } else {
                    const newData = { studentId: sid, uid: auth.currentUser.uid, role: INITIAL_ADMINS.includes(sid) ? 'admin' : 'user', totalPaid: 0 };
                    await setDoc(studentRef, newData);
                    this.userData = newData;
                }
                this.loading = false;
            },

            async logout() {
                await signOut(auth);
                this.userData = null;
                this.loginInput = '';
            },

            getMyTotal() {
                return this.transactions
                    .filter(t => t.studentId === this.userData.studentId && t.status === 'Approved')
                    .reduce((sum, t) => sum + (Number(t.amount) || 0), 0);
            },

            getTotalBalance() {
                return this.ledger.reduce((sum, item) => sum + (Number(item.Income) || 0) - (Number(item.Expense) || 0), 0);
            },

            async updateWeek(val) {
                const configRef = doc(db, 'artifacts', appId, 'public', 'data', 'config');
                await updateDoc(configRef, { currentWeek: Math.max(1, this.config.currentWeek + val) });
            },

            async approve(t) {
                const student = this.students.find(s => s.studentId === t.studentId);
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'transactions', t.id), { status: 'Approved' });
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'students', t.studentId), { 
                    totalPaid: (student.totalPaid || 0) + Number(t.amount) 
                });
            }
        });
    </script>
</body>
</html>
