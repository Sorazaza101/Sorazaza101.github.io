<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITDI Fund Management</title>
    <!-- Tailwind CSS: หัวใจของความสวยงาม -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js: คุมระบบการทำงาน -->
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Google Fonts: Anuphan อ่านง่าย ทันสมัย -->
    <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        [x-cloak] { display: none !important; }
        body { font-family: 'Anuphan', sans-serif; -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .dark-card { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(16px); border: 1px solid rgba(51, 65, 85, 0.5); }
        .page-enter { animation: slideUp 0.5s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        /* ซ่อน Scrollbar */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff', 100: '#e0f2fe', 200: '#bae6fd', 300: '#7dd3fc', 400: '#38bdf8',
                            500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1', 800: '#075985', 900: '#0c4a6e',
                        }
                    },
                    borderRadius: { '4xl': '2.5rem' }
                }
            }
        }
    </script>
</head>
<body x-data="itdiApp()" class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 transition-colors duration-500 min-h-screen" :class="{ 'dark': isDarkMode }">

    <!-- แถบดาวน์โหลด/โหลดข้อมูล -->
    <div x-show="loading" class="fixed inset-0 z-[100] flex flex-col items-center justify-center bg-white dark:bg-slate-950 transition-opacity duration-500">
        <div class="relative w-24 h-24">
            <div class="absolute inset-0 border-4 border-brand-500/20 rounded-full"></div>
            <div class="absolute inset-0 border-4 border-brand-500 border-t-transparent rounded-full animate-spin"></div>
            <div class="absolute inset-0 flex items-center justify-center text-brand-500">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
            </div>
        </div>
        <p class="mt-8 font-black text-slate-400 tracking-[0.3em] text-[10px] uppercase animate-pulse">ITDI Fund Real-time System</p>
    </div>

    <!-- หน้า Login (UI ใหม่พรีเมียม) -->
    <template x-if="!userData">
        <div class="min-h-screen flex items-center justify-center p-6 relative overflow-hidden">
            <!-- Background Decorations -->
            <div class="absolute top-0 -left-20 w-96 h-96 bg-brand-500/10 rounded-full blur-[120px]"></div>
            <div class="absolute bottom-0 -right-20 w-96 h-96 bg-indigo-500/10 rounded-full blur-[120px]"></div>

            <div class="w-full max-w-md dark-card p-12 rounded-[3.5rem] shadow-2xl relative z-10 border border-white/10 animate-in fade-in zoom-in duration-700">
                <div class="text-center mb-12">
                    <div class="inline-flex p-6 bg-gradient-to-br from-brand-500 to-indigo-600 rounded-[2rem] text-white mb-8 shadow-2xl shadow-brand-500/40 transform hover:scale-110 transition-all cursor-pointer">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-12 h-12" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z" /></svg>
                    </div>
                    <h1 class="text-4xl font-black tracking-tighter italic">ITDI FUND</h1>
                    <p class="text-slate-500 dark:text-slate-400 text-sm mt-3 font-bold uppercase tracking-widest opacity-60">Authentication</p>
                </div>
                
                <form @submit.prevent="login()" class="space-y-6">
                    <div class="relative group">
                        <div class="absolute left-6 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-brand-500 transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
                        </div>
                        <input type="text" x-model="loginInput" placeholder="รหัสนักศึกษา / อีเมล" class="w-full pl-16 pr-8 py-6 rounded-3xl border border-slate-200 dark:border-slate-800 bg-white/50 dark:bg-slate-900/50 focus:ring-[12px] focus:ring-brand-500/10 outline-none font-bold transition-all placeholder:font-normal text-lg shadow-inner" required>
                    </div>
                    <button class="w-full bg-brand-600 hover:bg-brand-700 active:scale-95 text-white font-black py-6 rounded-3xl shadow-2xl shadow-brand-600/30 transition-all flex items-center justify-center gap-3 text-lg uppercase tracking-widest">
                        เข้าใช้งาน <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M13 7l5 5m0 0l-5 5m5-5H6" /></svg>
                    </button>
                </form>
                
                <div class="mt-12 pt-8 border-t border-slate-100 dark:border-slate-800 text-center">
                    <p class="text-[10px] font-black text-slate-400 uppercase tracking-[0.4em]">ITDI Digital Innovation • SKRU</p>
                </div>
            </div>
        </div>
    </template>

    <!-- หน้าหลัก (UI/UX แบบมืออาชีพ) -->
    <template x-if="userData">
        <div class="flex min-h-screen">
            <!-- Sidebar (Mobile & Desktop) -->
            <aside class="fixed inset-y-0 left-0 z-[60] w-80 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800/50 transition-transform duration-500 lg:translate-x-0" :class="isSidebarOpen ? 'translate-x-0' : '-translate-x-full'">
                <div class="p-10 h-full flex flex-col">
                    <div class="flex items-center gap-5 mb-16">
                        <div class="p-4 bg-gradient-to-br from-brand-600 to-indigo-700 rounded-2xl text-white shadow-2xl shadow-brand-500/40"><svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg></div>
                        <div>
                            <span class="font-black text-2xl tracking-tighter block leading-none">ITDI FUND</span>
                            <span class="text-[10px] font-black text-brand-500 uppercase tracking-widest mt-1 block">Management</span>
                        </div>
                    </div>

                    <nav class="space-y-3 flex-1">
                        <template x-for="item in menuItems">
                            <button @click="activeTab = item.id; isSidebarOpen = false" 
                                    :class="activeTab === item.id ? 'bg-brand-600 text-white shadow-2xl shadow-brand-500/40 translate-x-2 scale-105' : 'text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 hover:translate-x-1'" 
                                    class="w-full flex items-center gap-5 px-8 py-5 rounded-[2rem] font-black transition-all duration-500 text-sm">
                                <span x-html="item.icon"></span>
                                <span x-text="item.label"></span>
                            </button>
                        </template>
                        
                        <!-- Admin Menu Section -->
                        <div x-show="userData.role === 'admin'" class="pt-10">
                            <p class="px-8 mb-4 text-[11px] font-black text-slate-400 uppercase tracking-[0.3em]">Administrator</p>
                            <button @click="activeTab = 'admin'; isSidebarOpen = false" 
                                    :class="activeTab === 'admin' ? 'bg-indigo-600 text-white shadow-2xl shadow-indigo-500/40 translate-x-2 scale-105' : 'text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 hover:translate-x-1'" 
                                    class="w-full flex items-center gap-5 px-8 py-5 rounded-[2rem] font-black transition-all duration-500 text-sm">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                                ควบคุมระบบ
                            </button>
                        </div>
                    </nav>

                    <!-- User Footer -->
                    <div class="mt-auto pt-10 border-t border-slate-100 dark:border-slate-800 space-y-8">
                        <div class="flex items-center gap-5 px-2">
                            <div class="w-14 h-14 rounded-3xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center font-black text-brand-600 border border-white dark:border-slate-700 shadow-xl" x-text="userData.studentId.slice(-3)"></div>
                            <div class="overflow-hidden">
                                <p class="text-base font-black truncate leading-none tracking-tighter" x-text="userData.studentId"></p>
                                <p class="text-[10px] uppercase font-bold text-slate-400 tracking-[0.2em] mt-2" x-text="userData.role"></p>
                            </div>
                        </div>
                        <div class="flex gap-4">
                            <button @click="isDarkMode = !isDarkMode" class="flex-1 p-4 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 flex justify-center hover:bg-slate-50 transition-all active:scale-90 shadow-lg">
                                <svg x-show="!isDarkMode" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-slate-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>
                                <svg x-show="isDarkMode" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-amber-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
                            </button>
                            <button @click="logout()" class="flex-1 p-4 rounded-2xl bg-rose-500/10 text-rose-600 border border-rose-500/20 flex justify-center hover:bg-rose-600 hover:text-white transition-all active:scale-90 shadow-lg">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>
                            </button>
                        </div>
                    </div>
                </div>
            </aside>

            <!-- Backdrop -->
            <div x-show="isSidebarOpen" @click="isSidebarOpen = false" x-transition.opacity class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm z-50 lg:hidden"></div>

            <!-- Main Panel -->
            <main class="flex-1 lg:ml-80 p-6 lg:p-16 relative">
                <!-- Mobile Header -->
                <header class="flex lg:hidden items-center justify-between mb-12">
                    <button @click="isSidebarOpen = true" class="p-4 rounded-3xl bg-white dark:bg-slate-900 shadow-2xl border border-slate-100 dark:border-slate-800 active:scale-90 transition-all"><svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" /></svg></button>
                    <div class="flex items-center gap-3">
                        <div class="w-2.5 h-2.5 rounded-full bg-brand-500 animate-pulse"></div>
                        <span class="font-black text-2xl tracking-tighter italic">ITDI FUND</span>
                    </div>
                    <div class="w-14"></div>
                </header>

                <div class="max-w-6xl mx-auto space-y-16">
                    
                    <!-- Page Heading -->
                    <div class="page-enter">
                        <h2 class="text-6xl lg:text-7xl font-black tracking-tighter italic leading-none mb-6" x-text="getCurrentPageTitle()"></h2>
                        <div class="flex flex-wrap items-center gap-5 text-slate-400 font-black uppercase text-[10px] tracking-[0.3em]">
                            <div class="flex items-center gap-2 px-4 py-2 bg-brand-500/10 text-brand-600 rounded-full border border-brand-500/20 shadow-sm">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                                <span x-text="'อาทิตย์ที่ ' + config.currentWeek"></span>
                            </div>
                            <span class="flex items-center gap-2"><div class="w-2 h-2 rounded-full bg-emerald-500"></div> เรียลไทม์</span>
                        </div>
                    </div>

                    <!-- Sections Wrapper -->
                    <div class="page-enter delay-200">
                        <!-- Dashboard -->
                        <div x-show="activeTab === 'dashboard'" class="space-y-12">
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-10">
                                <div class="p-12 bg-gradient-to-br from-brand-600 to-indigo-900 text-white rounded-[3.5rem] shadow-3xl shadow-brand-500/40 relative group overflow-hidden">
                                    <div class="absolute -top-10 -right-10 p-10 opacity-10 group-hover:scale-125 transition-transform duration-1000 rotate-12"><svg xmlns="http://www.w3.org/2000/svg" class="w-64 h-64" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" /></svg></div>
                                    <p class="text-brand-200 text-xs font-black uppercase tracking-[0.4em] mb-6 opacity-60">My Contribution</p>
                                    <div class="flex items-baseline gap-4">
                                        <h3 class="text-7xl font-black tracking-tighter leading-none" x-text="getMyTotal().toLocaleString()"></h3>
                                        <span class="text-3xl font-black opacity-30 italic">THB</span>
                                    </div>
                                    <div class="mt-16 pt-8 border-t border-white/10 flex justify-between items-center">
                                        <span class="text-[11px] font-black uppercase tracking-widest text-brand-300">Goal Week 1-<span x-text="config.currentWeek"></span></span>
                                        <span class="text-base font-black tracking-tight bg-white/20 px-5 py-1.5 rounded-full" x-text="(config.currentWeek * 30).toLocaleString() + ' ฿'"></span>
                                    </div>
                                </div>

                                <div class="p-12 dark-card rounded-[3.5rem] shadow-2xl relative hover:translate-y-[-10px] transition-all duration-500 group">
                                    <p class="text-slate-400 text-xs font-black uppercase tracking-[0.4em] mb-6 opacity-60">Central Balance</p>
                                    <div class="flex items-baseline gap-4">
                                        <h3 class="text-7xl font-black tracking-tighter text-emerald-500 leading-none" x-text="getTotalBalance().toLocaleString()"></h3>
                                        <span class="text-3xl font-black text-slate-700 italic">THB</span>
                                    </div>
                                    <div class="mt-16 flex items-center gap-4 text-emerald-500 text-[11px] font-black uppercase tracking-[0.3em]">
                                        <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse shadow-[0_0_15px_rgba(16,185,129,0.5)]"></div>
                                        Updated now
                                    </div>
                                </div>

                                <div class="p-12 dark-card rounded-[3.5rem] shadow-2xl hover:translate-y-[-10px] transition-all duration-500 group" :class="((config.currentWeek * 30) - getMyTotal()) > 0 ? 'border-rose-500/30' : ''">
                                    <p class="text-slate-400 text-xs font-black uppercase tracking-[0.4em] mb-6 opacity-60">Outstanding</p>
                                    <div class="flex items-baseline gap-4">
                                        <h3 class="text-7xl font-black tracking-tighter leading-none" :class="((config.currentWeek * 30) - getMyTotal()) > 0 ? 'text-rose-500' : 'text-slate-700'" x-text="Math.max(0, (config.currentWeek * 30) - getMyTotal()).toLocaleString()"></h3>
                                        <span class="text-3xl font-black text-slate-700 italic">THB</span>
                                    </div>
                                    <div class="mt-16">
                                        <template x-if="((config.currentWeek * 30) - getMyTotal()) <= 0">
                                            <span class="px-5 py-2 bg-emerald-500/10 text-emerald-600 rounded-full text-[10px] font-black uppercase tracking-[0.3em] border border-emerald-500/20 shadow-lg">Excellent discipline</span>
                                        </template>
                                        <template x-if="((config.currentWeek * 30) - getMyTotal()) > 0">
                                            <span class="px-5 py-2 bg-rose-500/10 text-rose-600 rounded-full text-[10px] font-black uppercase tracking-[0.3em] border border-rose-500/20 shadow-lg">Pending payment</span>
                                        </template>
                                    </div>
                                </div>
                            </div>

                            <!-- Activity Table -->
                            <div class="dark-card rounded-[4rem] shadow-3xl overflow-hidden border border-slate-800/50">
                                <div class="p-10 border-b border-slate-800/50 flex justify-between items-center bg-slate-900/40">
                                    <h4 class="font-black text-2xl tracking-tight italic flex items-center gap-4"><svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-brand-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg> รายการอัปเดตล่าสุด</h4>
                                    <button @click="activeTab = 'history'" class="text-[10px] font-black uppercase tracking-[0.3em] text-brand-500 hover:text-brand-400 bg-brand-500/10 px-5 py-2.5 rounded-full transition-all">View Statement</button>
                                </div>
                                <div class="overflow-x-auto no-scrollbar">
                                    <table class="w-full text-left">
                                        <thead class="bg-slate-900/50 text-[11px] font-black uppercase tracking-[0.4em] text-slate-500 border-b border-slate-800/50">
                                            <tr>
                                                <th class="px-12 py-8">User ID</th>
                                                <th class="px-12 py-8 text-center">Week</th>
                                                <th class="px-12 py-8">Amount</th>
                                                <th class="px-12 py-8 text-right">Status</th>
                                            </tr>
                                        </thead>
                                        <tbody class="divide-y divide-slate-800/50 font-medium">
                                            <template x-for="t in transactions.slice(0, 8)">
                                                <tr class="hover:bg-slate-800/30 transition-all cursor-default group">
                                                    <td class="px-12 py-8 font-black text-base group-hover:translate-x-3 transition-transform" x-text="t.studentId"></td>
                                                    <td class="px-12 py-8 text-center font-black text-slate-500 italic tracking-widest uppercase" x-text="'W' + t.week"></td>
                                                    <td class="px-12 py-8 font-black text-brand-500 text-xl tracking-tighter" x-text="'+' + t.amount + ' ฿'"></td>
                                                    <td class="px-12 py-8 text-right">
                                                        <span class="px-5 py-2 rounded-full text-[10px] font-black uppercase tracking-[0.2em] shadow-lg" 
                                                              :class="t.status === 'Approved' ? 'bg-emerald-500/10 text-emerald-600 border border-emerald-500/20' : 'bg-amber-500/10 text-amber-600 border border-amber-500/20'" 
                                                              x-text="t.status === 'Approved' ? 'จ่ายแล้ว' : 'รอเช็ค'"></span>
                                                    </td>
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>

                        <!-- History Section -->
                        <div x-show="activeTab === 'history'" class="space-y-12">
                             <div class="dark-card rounded-[3.5rem] shadow-3xl overflow-hidden border-none">
                                <div class="overflow-x-auto no-scrollbar">
                                    <table class="w-full text-left">
                                        <thead class="bg-slate-900/50 text-[11px] font-black uppercase tracking-[0.4em] text-slate-500 border-b border-slate-800/50">
                                            <tr>
                                                <th class="px-12 py-10">Time Log</th>
                                                <th class="px-12 py-10 text-center">Interval</th>
                                                <th class="px-12 py-10">Amount</th>
                                                <th class="px-12 py-10 text-right">Final State</th>
                                            </tr>
                                        </thead>
                                        <tbody class="divide-y divide-slate-800/50">
                                            <template x-for="t in transactions.filter(tr => tr.studentId === userData.studentId).sort((a,b) => b.week - a.week)">
                                                <tr class="hover:bg-slate-800/40 transition-all">
                                                    <td class="px-12 py-10 text-sm font-bold text-slate-400" x-text="t.ประทับเวลา"></td>
                                                    <td class="px-12 py-10 text-center font-black italic tracking-widest text-slate-600 uppercase" x-text="'Week ' + t.week"></td>
                                                    <td class="px-12 py-10 text-3xl font-black text-brand-500 tracking-tighter" x-text="'+' + t.amount + ' ฿'"></td>
                                                    <td class="px-12 py-10 text-right">
                                                        <span class="px-6 py-2.5 rounded-full text-[11px] font-black uppercase tracking-[0.3em] shadow-2xl" 
                                                              :class="t.status === 'Approved' ? 'bg-emerald-500/10 text-emerald-600 border border-emerald-500/20' : 'bg-amber-500/10 text-amber-600 border border-amber-500/20'" 
                                                              x-text="t.status"></span>
                                                    </td>
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>

                        <!-- Ledger Section -->
                        <div x-show="activeTab === 'ledger'" class="space-y-12">
                             <div class="dark-card rounded-[3.5rem] shadow-3xl overflow-hidden border-none">
                                <div class="overflow-x-auto no-scrollbar">
                                    <table class="w-full text-left">
                                        <thead class="bg-slate-900/50 text-[11px] font-black uppercase tracking-[0.4em] text-slate-500 border-b border-slate-800/50">
                                            <tr>
                                                <th class="px-12 py-10">Date</th>
                                                <th class="px-12 py-10">Event Details</th>
                                                <th class="px-12 py-10 text-emerald-500 italic">Credit (+)</th>
                                                <th class="px-12 py-10 text-rose-500 italic text-right">Debit (-)</th>
                                            </tr>
                                        </thead>
                                        <tbody class="divide-y divide-slate-800/50">
                                            <template x-for="l in ledger">
                                                <tr class="hover:bg-slate-800/40 transition-all group">
                                                    <td class="px-12 py-10 text-sm font-bold text-slate-500" x-text="l.Date"></td>
                                                    <td class="px-12 py-10 text-base font-black tracking-tight group-hover:translate-x-3 transition-transform" x-text="l.Item"></td>
                                                    <td class="px-12 py-10 text-3xl font-black text-emerald-600 tracking-tighter" x-text="l.Income > 0 ? '+' + Number(l.Income).toLocaleString() : '-'"></td>
                                                    <td class="px-12 py-10 text-3xl font-black text-rose-600 text-right tracking-tighter" x-text="l.Expense > 0 ? '-' + Number(l.Expense).toLocaleString() : '-'"></td>
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>

                        <!-- Admin Section -->
                        <div x-show="activeTab === 'admin' && userData.role === 'admin'" class="space-y-16">
                            <div class="flex flex-col md:flex-row justify-between items-center gap-12 bg-indigo-600 p-16 rounded-[4rem] shadow-3xl shadow-indigo-600/40 text-white relative overflow-hidden group">
                                <div class="absolute -top-20 -right-20 w-96 h-96 bg-white/10 rounded-full blur-[120px] group-hover:scale-150 transition-transform duration-1000"></div>
                                <div class="z-10 text-center md:text-left">
                                    <h3 class="text-6xl font-black tracking-tighter italic leading-none mb-4">Set Week</h3>
                                    <p class="text-indigo-200 text-xs font-bold uppercase tracking-[0.4em] opacity-80">Global payment interval control</p>
                                </div>
                                <div class="flex items-center gap-12 bg-white/10 p-6 rounded-[3rem] backdrop-blur-2xl border border-white/20 z-10 scale-110 shadow-3xl">
                                    <button @click="updateWeek(-1)" class="p-6 bg-white/10 hover:bg-rose-500 rounded-[1.5rem] transition-all active:scale-75 shadow-lg group"><svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M20 12H4" /></svg></button>
                                    <div class="text-center px-10">
                                        <span class="font-black text-7xl tracking-tighter italic" x-text="config.currentWeek"></span>
                                    </div>
                                    <button @click="updateWeek(1)" class="p-6 bg-white/10 hover:bg-emerald-500 rounded-[1.5rem] transition-all active:scale-75 shadow-lg group"><svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M12 4v16m8-8H4" /></svg></button>
                                </div>
                            </div>

                            <div class="grid grid-cols-1 lg:grid-cols-2 gap-16">
                                <!-- Pending Approvals -->
                                <div class="space-y-10">
                                    <h4 class="text-[14px] font-black text-slate-500 uppercase tracking-[0.5em] px-10 flex items-center gap-5">
                                        <div class="w-3 h-3 rounded-full bg-amber-500 animate-ping"></div>
                                        Check required (<span x-text="transactions.filter(tr => tr.status === 'Pending').length"></span>)
                                    </h4>
                                    <div class="space-y-6 px-4">
                                        <template x-for="t in transactions.filter(tr => tr.status === 'Pending')">
                                            <div class="dark-card p-10 rounded-[3rem] shadow-2xl flex justify-between items-center group hover:translate-x-3 transition-transform duration-500 border-none">
                                                <div class="flex items-center gap-8">
                                                    <div class="w-16 h-16 rounded-[1.5rem] bg-slate-800 flex items-center justify-center font-black text-xl text-brand-500 shadow-inner group-hover:scale-110 transition-transform" x-text="t.studentId.slice(-3)"></div>
                                                    <div>
                                                        <p class="font-black text-2xl tracking-tighter leading-none mb-2" x-text="t.studentId"></p>
                                                        <p class="text-[11px] font-black text-slate-500 uppercase tracking-[0.3em] italic" x-text="'Week ' + t.week + ' • ' + t.amount + ' ฿'"></p>
                                                    </div>
                                                </div>
                                                <button @click="approve(t)" class="p-6 bg-emerald-500/10 text-emerald-500 rounded-3xl hover:bg-emerald-500 hover:text-white transition-all shadow-3xl shadow-emerald-500/20 active:scale-75"><svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M5 13l4 4L19 7" /></svg></button>
                                            </div>
                                        </template>
                                        <template x-if="transactions.filter(tr => tr.status === 'Pending').length === 0">
                                            <div class="p-32 text-center text-slate-600 font-black italic border-4 border-dashed border-slate-900 rounded-[4rem] uppercase tracking-[0.5em] text-xs opacity-30">No task left</div>
                                        </template>
                                    </div>
                                </div>

                                <!-- Role Management -->
                                <div class="space-y-10">
                                    <h4 class="text-[14px] font-black text-slate-500 uppercase tracking-[0.5em] px-10 flex items-center gap-5">
                                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-brand-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" /></svg>
                                        Permissions
                                    </h4>
                                    <div class="dark-card rounded-[3.5rem] shadow-3xl overflow-hidden border-none">
                                        <div class="max-h-[600px] overflow-y-auto no-scrollbar px-2">
                                            <table class="w-full text-left">
                                                <thead class="sticky top-0 bg-slate-900/90 backdrop-blur-xl z-10 border-b border-slate-800 text-[10px] font-black uppercase tracking-[0.4em] text-slate-500">
                                                    <tr>
                                                        <th class="px-10 py-8">Identity</th>
                                                        <th class="px-10 py-8 text-right">Access Role</th>
                                                    </tr>
                                                </thead>
                                                <tbody class="divide-y divide-slate-800/50">
                                                    <template x-for="s in students.sort((a,b) => a.studentId.localeCompare(b.studentId))">
                                                        <tr class="hover:bg-slate-800/30 transition-all">
                                                            <td class="px-10 py-8 font-black text-lg tracking-tighter" x-text="s.studentId"></td>
                                                            <td class="px-10 py-8 text-right">
                                                                <button @click="toggleRole(s)" class="px-6 py-2.5 rounded-2xl text-[11px] font-black tracking-[0.3em] uppercase transition-all shadow-2xl active:scale-90" :class="s.role === 'admin' ? 'bg-indigo-600 text-white shadow-indigo-600/30 border-none' : 'bg-slate-800 text-slate-400 hover:text-white border border-slate-700'" x-text="s.role || 'user'"></button>
                                                            </td>
                                                        </tr>
                                                    </template>
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </main>
        </div>
    </template>

    <!-- Firebase SDK (Version 11) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, getDoc, updateDoc, onSnapshot, query, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAOXm4aDbToq4ZahlsbgwFz8nfkIviL-bs",
            authDomain: "itdi-fund.firebaseapp.com",
            projectId: "itdi-fund",
            storageBucket: "itdi-fund.firebasestorage.app",
            messagingSenderId: "770219582415",
            appId: "1:770219582415:web:e6c780dd599bb4f7d528ba"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = 'itdi-fund-production';

        window.itdiApp = () => ({
            loading: true,
            isDarkMode: true,
            isSidebarOpen: false,
            activeTab: 'dashboard',
            userData: null,
            loginInput: '',
            config: { currentWeek: 1 },
            students: [],
            transactions: [],
            ledger: [],
            menuItems: [
                { id: 'dashboard', label: 'แดชบอร์ด', icon: '<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v-2zM14 16a2 2 0 012-2h2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" /></svg>' },
                { id: 'history', label: 'ประวัติการจ่าย', icon: '<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>' },
                { id: 'ledger', label: 'บัญชีกลาง', icon: '<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" /></svg>' }
            ],

            async init() {
                if(localStorage.getItem('itdi_theme') === 'light') this.isDarkMode = false;
                this.$watch('isDarkMode', val => localStorage.setItem('itdi_theme', val ? 'dark' : 'light'));
                
                await signInAnonymously(auth);
                onAuthStateChanged(auth, async (u) => {
                    if (u) {
                        this.syncData();
                        // ระบบจดจำผู้ใช้
                        const savedUser = localStorage.getItem('itdi_user');
                        if (savedUser) {
                            this.loginInput = savedUser;
                            await this.login(true);
                        }
                    } else {
                        this.userData = null;
                        this.loading = false;
                    }
                });
            },

            syncData() {
                onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'config'), s => { if (s.exists()) this.config = s.data(); this.loading = false; });
                onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'students'), s => {
                    this.students = s.docs.map(d => ({ id: d.id, ...d.data() }));
                    if (this.userData) {
                        const current = this.students.find(st => st.studentId === this.userData.studentId);
                        if (current) this.userData = current;
                    }
                });
                onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'transactions'), s => { this.transactions = s.docs.map(d => ({ id: d.id, ...d.data() })); });
                onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'ledger'), s => { this.ledger = s.docs.map(d => ({ id: d.id, ...d.data() })); });
            },

            async login(isAuto = false) {
                if(!isAuto) this.loading = true;
                const sid = this.loginInput.trim();
                if(!sid) return;

                const studentRef = doc(db, 'artifacts', appId, 'public', 'data', 'students', sid);
                const snap = await getDoc(studentRef);
                const INITIAL_ADMINS = ['684295024@parichat.skru.ac.th', 'admin'];

                if (snap.exists()) {
                    const data = snap.data();
                    const role = INITIAL_ADMINS.includes(sid) ? 'admin' : (data.role || 'user');
                    await updateDoc(studentRef, { uid: auth.currentUser.uid, role });
                    this.userData = { id: sid, ...data, role };
                } else {
                    const newData = { studentId: sid, uid: auth.currentUser.uid, role: INITIAL_ADMINS.includes(sid) ? 'admin' : 'user', totalPaid: 0 };
                    await setDoc(studentRef, newData);
                    this.userData = newData;
                }
                localStorage.setItem('itdi_user', sid);
                this.loading = false;
            },

            async logout() {
                localStorage.removeItem('itdi_user');
                await signOut(auth);
                this.userData = null;
                this.loginInput = '';
            },

            getMyTotal() {
                if (!this.userData) return 0;
                return this.transactions
                    .filter(t => t.studentId === this.userData.studentId && t.status === 'Approved')
                    .reduce((sum, t) => sum + (Number(t.amount) || 0), 0);
            },

            getTotalBalance() {
                return this.ledger.reduce((sum, item) => sum + (Number(item.Income) || 0) - (Number(item.Expense) || 0), 0);
            },

            getCurrentPageTitle() {
                if (this.activeTab === 'admin') return 'แผงควบคุม';
                const item = this.menuItems.find(m => m.id === this.activeTab);
                return item ? item.label : '';
            },

            async updateWeek(val) {
                const configRef = doc(db, 'artifacts', appId, 'public', 'data', 'config');
                await updateDoc(configRef, { currentWeek: Math.max(1, this.config.currentWeek + val) });
            },

            async approve(t) {
                const student = this.students.find(s => s.studentId === t.studentId);
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'transactions', t.id), { status: 'Approved' });
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'students', t.studentId), { 
                    totalPaid: (student.totalPaid || 0) + Number(t.amount) 
                });
            },

            async toggleRole(s) {
                const newRole = s.role === 'admin' ? 'user' : 'admin';
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'students', s.id), { role: newRole });
            }
        });
    </script>
</body>
</html>
