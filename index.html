<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITDI Fund Management</title>
    <!-- Tailwind CSS สำหรับ Utility-First Design -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js สำหรับคุม State และ Logic -->
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Google Fonts: Anuphan สำหรับภาษาไทยที่ดูสะอาดตา -->
    <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        [x-cloak] { display: none !important; }
        body { 
            font-family: 'Anuphan', sans-serif; 
            -webkit-tap-highlight-color: transparent;
        }
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .dark .glass {
            background: rgba(15, 23, 42, 0.7);
        }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Custom Animation */
        .page-enter { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe', 300: '#93c5fd', 400: '#60a5fa',
                            500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8', 800: '#1e40af', 900: '#1e3a8a',
                        }
                    },
                    borderRadius: {
                        '4xl': '2rem',
                    }
                }
            }
        }
    </script>
</head>
<body x-data="itdiApp()" class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 transition-colors duration-300 min-h-screen overflow-x-hidden" :class="{ 'dark': isDarkMode }">

    <!-- Loading Screen -->
    <div x-show="loading" x-transition.opacity class="fixed inset-0 z-[100] flex flex-col items-center justify-center bg-white dark:bg-slate-950">
        <div class="relative w-20 h-20">
            <div class="absolute inset-0 border-4 border-brand-500/20 rounded-full"></div>
            <div class="absolute inset-0 border-4 border-brand-500 border-t-transparent rounded-full animate-spin"></div>
        </div>
        <p class="mt-6 font-semibold text-slate-400 tracking-widest animate-pulse">ITDI FUND LOADING...</p>
    </div>

    <!-- Login Screen -->
    <template x-if="!userData">
        <div class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
            <!-- Decorative Blobs -->
            <div class="absolute -top-20 -left-20 w-80 h-80 bg-brand-500/10 rounded-full blur-3xl"></div>
            <div class="absolute -bottom-20 -right-20 w-80 h-80 bg-indigo-500/10 rounded-full blur-3xl"></div>

            <div class="w-full max-w-md glass border border-white/20 dark:border-slate-800 p-10 rounded-[2.5rem] shadow-2xl relative z-10">
                <div class="text-center mb-10">
                    <div class="inline-flex p-4 bg-gradient-to-br from-brand-500 to-indigo-600 rounded-2xl text-white mb-6 shadow-xl shadow-brand-500/40 transform hover:scale-110 transition-transform">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-10 h-10" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" /></svg>
                    </div>
                    <h1 class="text-3xl font-black tracking-tighter">ITDI FUND</h1>
                    <p class="text-slate-400 dark:text-slate-500 text-sm mt-2 font-medium">เข้าสู่ระบบจัดการเงินกองกลาง</p>
                </div>
                
                <form @submit.prevent="login()" class="space-y-6">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-widest text-slate-500 dark:text-slate-400 mb-2 ml-1">รหัสนักศึกษา / อีเมล</label>
                        <input type="text" x-model="loginInput" placeholder="684295XXX" class="w-full px-6 py-4 rounded-2xl border border-slate-200 dark:border-slate-800 bg-white/50 dark:bg-slate-950/50 focus:ring-4 focus:ring-brand-500/10 outline-none font-bold transition-all placeholder:font-normal" required>
                    </div>
                    <button class="w-full bg-brand-600 hover:bg-brand-700 text-white font-black py-4 rounded-2xl shadow-xl shadow-brand-600/30 transition-all active:scale-[0.98] flex items-center justify-center gap-2">
                        เข้าสู่ระบบ <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>
                    </button>
                </form>
                
                <p class="mt-10 text-center text-[10px] font-bold text-slate-400 uppercase tracking-[0.3em]">ITDI Digital Innovation • SKRU</p>
            </div>
        </div>
    </template>

    <!-- Main Layout -->
    <template x-if="userData">
        <div class="flex min-h-screen">
            <!-- Desktop Sidebar -->
            <aside class="fixed inset-y-0 left-0 z-50 w-72 bg-white/80 dark:bg-slate-900/80 backdrop-blur-xl border-r border-slate-100 dark:border-slate-800 transition-transform lg:translate-x-0 overflow-y-auto scrollbar-hide" :class="isSidebarOpen ? 'translate-x-0' : '-translate-x-full'">
                <div class="p-8 h-full flex flex-col">
                    <div class="flex items-center gap-4 mb-12">
                        <div class="p-2 bg-brand-600 rounded-xl text-white shadow-lg shadow-brand-500/30"><svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg></div>
                        <span class="font-black text-2xl tracking-tighter">ITDI FUND</span>
                        <button @click="isSidebarOpen = false" class="lg:hidden ml-auto p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full transition-colors"><svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg></button>
                    </div>

                    <nav class="space-y-1.5 flex-1">
                        <button @click="activeTab = 'dashboard'; isSidebarOpen = false" :class="activeTab === 'dashboard' ? 'bg-brand-600 text-white shadow-xl shadow-brand-500/30 translate-x-1' : 'text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 hover:translate-x-1'" class="w-full flex items-center gap-4 px-6 py-4 rounded-2xl font-bold transition-all text-sm">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" /></svg>
                            แดชบอร์ด
                        </button>
                        <button @click="activeTab = 'history'; isSidebarOpen = false" :class="activeTab === 'history' ? 'bg-brand-600 text-white shadow-xl shadow-brand-500/30 translate-x-1' : 'text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 hover:translate-x-1'" class="w-full flex items-center gap-4 px-6 py-4 rounded-2xl font-bold transition-all text-sm">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                            ประวัติของฉัน
                        </button>
                        <button @click="activeTab = 'ledger'; isSidebarOpen = false" :class="activeTab === 'ledger' ? 'bg-brand-600 text-white shadow-xl shadow-brand-500/30 translate-x-1' : 'text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 hover:translate-x-1'" class="w-full flex items-center gap-4 px-6 py-4 rounded-2xl font-bold transition-all text-sm">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" /></svg>
                            บัญชีกลาง
                        </button>
                        
                        <div x-show="userData.role === 'admin'" class="pt-6">
                            <p class="px-6 mb-2 text-[10px] font-black text-slate-400 uppercase tracking-widest">Administrator</p>
                            <button @click="activeTab = 'admin'; isSidebarOpen = false" :class="activeTab === 'admin' ? 'bg-indigo-600 text-white shadow-xl shadow-indigo-500/30 translate-x-1' : 'text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 hover:translate-x-1'" class="w-full flex items-center gap-4 px-6 py-4 rounded-2xl font-bold transition-all text-sm">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                                ควบคุมระบบ
                            </button>
                        </div>
                    </nav>

                    <div class="mt-auto pt-8 border-t border-slate-100 dark:border-slate-800 space-y-6">
                        <div class="flex items-center gap-4 px-3 py-2 bg-slate-50 dark:bg-slate-800/50 rounded-2xl border border-slate-100 dark:border-slate-800">
                            <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-brand-500 to-indigo-600 flex items-center justify-center font-bold text-white shadow-lg" x-text="userData.studentId.slice(-3)"></div>
                            <div class="overflow-hidden">
                                <p class="text-sm font-black truncate leading-tight" x-text="userData.studentId"></p>
                                <p class="text-[10px] uppercase font-bold text-brand-600 dark:text-brand-400 tracking-widest mt-1" x-text="userData.role"></p>
                            </div>
                        </div>
                        <div class="flex gap-2">
                            <button @click="isDarkMode = !isDarkMode" class="flex-1 p-3.5 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 flex justify-center hover:bg-slate-50 dark:hover:bg-slate-700 transition-all active:scale-90">
                                <svg x-show="!isDarkMode" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-slate-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>
                                <svg x-show="isDarkMode" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-amber-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
                            </button>
                            <button @click="logout()" class="flex-1 p-3.5 rounded-2xl bg-rose-500/10 text-rose-600 border border-rose-500/20 flex justify-center hover:bg-rose-600 hover:text-white transition-all active:scale-90">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>
                            </button>
                        </div>
                    </div>
                </div>
            </aside>

            <!-- Backdrop for Mobile Sidebar -->
            <div x-show="isSidebarOpen" @click="isSidebarOpen = false" x-transition.opacity class="fixed inset-0 bg-slate-950/40 backdrop-blur-sm z-40 lg:hidden"></div>

            <!-- Main Panel -->
            <main class="flex-1 lg:ml-72 p-4 md:p-8 lg:p-12 relative">
                <!-- Mobile Header -->
                <header class="flex lg:hidden items-center justify-between mb-8 px-2">
                    <button @click="isSidebarOpen = true" class="p-3 bg-white dark:bg-slate-900 rounded-2xl shadow-lg border border-slate-100 dark:border-slate-800 active:scale-95 transition-all"><svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" /></svg></button>
                    <div class="flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-brand-500 animate-pulse"></span>
                        <span class="font-black text-xl tracking-tighter italic">ITDI FUND</span>
                    </div>
                    <div class="w-10"></div>
                </header>

                <div class="max-w-6xl mx-auto space-y-10">
                    
                    <!-- Page Heading -->
                    <div class="px-2">
                        <h2 class="text-4xl lg:text-5xl font-black tracking-tighter italic leading-none" x-text="activeTab === 'dashboard' ? 'แดชบอร์ด' : (activeTab === 'history' ? 'ประวัติการจ่าย' : (activeTab === 'ledger' ? 'สมุดบัญชีกลาง' : 'แผงควบคุม'))"></h2>
                        <div class="flex items-center gap-3 mt-3 text-slate-400 font-bold uppercase text-[10px] tracking-widest">
                            <span x-text="userData.studentId"></span>
                            <span class="w-1 h-1 bg-slate-300 dark:bg-slate-700 rounded-full"></span>
                            <span x-text="'วีคปัจจุบัน: ' + config.currentWeek" class="text-brand-500"></span>
                        </div>
                    </div>

                    <!-- Dashboard Section -->
                    <div x-show="activeTab === 'dashboard'" class="space-y-10 page-enter">
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 lg:gap-8">
                            <!-- Card 1 -->
                            <div class="p-8 lg:p-10 bg-gradient-to-br from-brand-600 to-indigo-700 text-white rounded-[2.5rem] shadow-2xl shadow-brand-500/30 relative overflow-hidden group">
                                <div class="absolute -top-10 -right-10 p-10 opacity-10 group-hover:scale-125 transition-transform duration-700"><svg xmlns="http://www.w3.org/2000/svg" class="w-40 h-40" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" /></svg></div>
                                <p class="text-brand-100 text-[10px] font-black uppercase tracking-[0.2em] mb-4">ยอดสะสมของคุณ</p>
                                <div class="flex items-baseline gap-3">
                                    <h3 class="text-6xl font-black tracking-tighter" x-text="getMyTotal().toLocaleString()"></h3>
                                    <span class="text-2xl font-bold opacity-40">฿</span>
                                </div>
                                <div class="mt-10 pt-6 border-t border-white/10 flex justify-between items-center text-[11px] font-bold">
                                    <span class="opacity-60 uppercase tracking-widest">Target Week 1-20</span>
                                    <span>600.00 ฿</span>
                                </div>
                            </div>
                            <!-- Card 2 -->
                            <div class="p-8 lg:p-10 bg-white dark:bg-slate-900 rounded-[2.5rem] shadow-xl border border-slate-100 dark:border-slate-800 relative group overflow-hidden">
                                <p class="text-slate-400 text-[10px] font-black uppercase tracking-[0.2em] mb-4">เงินกองกลางคงเหลือ</p>
                                <div class="flex items-baseline gap-3">
                                    <h3 class="text-6xl font-black tracking-tighter text-emerald-500" x-text="getTotalBalance().toLocaleString()"></h3>
                                    <span class="text-2xl font-bold text-slate-300">฿</span>
                                </div>
                                <div class="mt-10 flex items-center gap-2 text-emerald-500 text-[10px] font-black uppercase tracking-widest">
                                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                                    Real-time Sync
                                </div>
                            </div>
                            <!-- Card 3 -->
                            <div class="p-8 lg:p-10 bg-white dark:bg-slate-900 rounded-[2.5rem] shadow-xl border border-slate-100 dark:border-slate-800 group">
                                <p class="text-slate-400 text-[10px] font-black uppercase tracking-[0.2em] mb-4">ค้างชำระ (Week 1-<span x-text="config.currentWeek"></span>)</p>
                                <div class="flex items-baseline gap-3">
                                    <h3 class="text-6xl font-black tracking-tighter" :class="((config.currentWeek * 30) - getMyTotal()) > 0 ? 'text-rose-500' : 'text-slate-200 dark:text-slate-800'" x-text="Math.max(0, (config.currentWeek * 30) - getMyTotal()).toLocaleString()"></h3>
                                    <span class="text-2xl font-bold text-slate-300">฿</span>
                                </div>
                                <div class="mt-10">
                                    <template x-if="((config.currentWeek * 30) - getMyTotal()) <= 0">
                                        <span class="px-3 py-1 bg-emerald-500/10 text-emerald-600 rounded-full text-[10px] font-black uppercase tracking-widest border border-emerald-500/20">จ่ายครบแล้ว</span>
                                    </template>
                                    <template x-if="((config.currentWeek * 30) - getMyTotal()) > 0">
                                        <span class="px-3 py-1 bg-rose-500/10 text-rose-600 rounded-full text-[10px] font-black uppercase tracking-widest border border-rose-500/20">ยังค้างชำระ</span>
                                    </template>
                                </div>
                            </div>
                        </div>

                        <!-- Recent Table Summary -->
                        <div class="bg-white dark:bg-slate-900 rounded-[3rem] shadow-xl border border-slate-100 dark:border-slate-800 overflow-hidden">
                            <div class="p-8 border-b border-slate-50 dark:border-slate-800 flex justify-between items-center">
                                <h4 class="font-black text-xl tracking-tight">รายการล่าสุดในระบบ</h4>
                                <button @click="activeTab = 'history'" class="text-[10px] font-black uppercase tracking-widest text-brand-600 hover:underline">ดูประวัติทั้งหมด</button>
                            </div>
                            <div class="overflow-x-auto scrollbar-hide">
                                <table class="w-full text-left">
                                    <thead class="bg-slate-50/50 dark:bg-slate-800/50 text-[10px] font-black uppercase tracking-[0.3em] text-slate-400">
                                        <tr>
                                            <th class="px-8 py-6">ผู้ใช้งาน</th>
                                            <th class="px-8 py-6">สัปดาห์</th>
                                            <th class="px-8 py-6">ยอดโอน</th>
                                            <th class="px-8 py-6 text-right">สถานะ</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-slate-50 dark:divide-slate-800 font-medium">
                                        <template x-for="t in transactions.slice(0, 5)">
                                            <tr class="hover:bg-slate-50 dark:hover:bg-slate-800/30 transition-all cursor-default group">
                                                <td class="px-8 py-6 font-bold group-hover:translate-x-1 transition-transform" x-text="t.studentId"></td>
                                                <td class="px-8 py-6 text-slate-500" x-text="'Week ' + t.week"></td>
                                                <td class="px-8 py-6 font-black text-brand-600" x-text="t.amount + ' ฿'"></td>
                                                <td class="px-8 py-6 text-right">
                                                    <span class="px-3 py-1.5 rounded-full text-[10px] font-black uppercase tracking-widest" :class="t.status === 'Approved' ? 'bg-emerald-500/10 text-emerald-600 border border-emerald-500/20' : 'bg-amber-500/10 text-amber-600 border border-amber-500/20'" x-text="t.status === 'Approved' ? 'จ่ายแล้ว' : 'รอตรวจสอบ'"></span>
                                                </td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    <!-- History Section -->
                    <div x-show="activeTab === 'history'" class="space-y-8 page-enter">
                        <div class="bg-white dark:bg-slate-900 rounded-[2.5rem] shadow-xl border border-slate-100 dark:border-slate-800 overflow-hidden">
                            <div class="overflow-x-auto">
                                <table class="w-full text-left">
                                    <thead class="bg-slate-50 dark:bg-slate-800/50 text-[10px] font-black uppercase tracking-[0.3em] text-slate-400 border-b border-slate-100 dark:border-slate-800">
                                        <tr>
                                            <th class="px-10 py-8">วัน / เวลา</th>

                        <!-- Admin Controls -->
                        <div class="flex flex-col md:flex-row justify-between items-center gap-8 bg-indigo-600 p-10 rounded-[3rem] shadow-2xl shadow-indigo-600/30 text-white relative overflow-hidden">

                            </div>
                            <div class="flex items-center gap-8 bg-white/10 p-4 rounded-[2rem] backdrop-blur-md border border-white/10 z-10">
                                <button @click="updateWeek(-1)" class="p-5 bg-white/10 hover:bg-white/20 rounded-2xl transition-all active:scale-75 shadow-lg"><svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M20 12H4" /></svg></button>
                                <div class="text-center px-6">

                                <button @click="updateWeek(1)" class="p-5 bg-white/10 hover:bg-white/20 rounded-2xl transition-all active:scale-75 shadow-lg"><svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 4v16m8-8H4" /></svg></button>

                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-10">
                            <!-- Pending List -->
                            <div class="space-y-6">

                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-amber-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                                    รอการอนุมัติ (<span x-text="transactions.filter(tr => tr.status === 'Pending').length"></span>)
                                </h4>

                                            <div class="flex items-center gap-6">

                                                <div>

                                        </div>

                                    <template x-if="transactions.filter(tr => tr.status === 'Pending').length === 0">
                                        <div class="p-20 text-center text-slate-400 font-black italic border-4 border-dashed border-slate-100 dark:border-slate-900 rounded-[3rem] uppercase tracking-widest text-xs">เรียบร้อยทุกรายการ</div>

                            <!-- Member List -->
                            <div class="space-y-6">

                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-indigo-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
                                    รายชื่อสมาชิกและสิทธิ์
                                </h4>
                                <div class="bg-white dark:bg-slate-900 rounded-[2rem] shadow-xl overflow-hidden border border-slate-100 dark:border-slate-800">
                                    <div class="max-h-[600px] overflow-y-auto scrollbar-hide">
                                        <table class="w-full text-left">
                                            <thead class="sticky top-0 bg-white dark:bg-slate-900 z-10 border-b border-slate-50 dark:border-slate-800 text-[10px] font-black uppercase tracking-widest text-slate-400">
                                                <tr>
                                                    <th class="px-8 py-6">Student ID</th>
                                                    <th class="px-8 py-6 text-right">Role / Status</th>
                                                </tr>
                                            </thead>
                                            <tbody class="divide-y divide-slate-50 dark:divide-slate-800">
                                                <template x-for="s in students.sort((a,b) => a.studentId.localeCompare(b.studentId))">
                                                    <tr class="hover:bg-slate-50/50 dark:hover:bg-slate-800/30 transition-colors">
                                                        <td class="px-8 py-6 font-bold tracking-tight" x-text="s.studentId"></td>
                                                        <td class="px-8 py-6 text-right">
                                                            <button @click="toggleRole(s)" class="px-4 py-2 rounded-xl text-[10px] font-black tracking-widest uppercase transition-all shadow-lg active:scale-95" :class="s.role === 'admin' ? 'bg-indigo-600 text-white shadow-indigo-600/30 border-none' : 'bg-slate-100 dark:bg-slate-800 text-slate-500 border border-slate-200 dark:border-slate-700'" x-text="s.role || 'user'"></button>

    <!-- Firebase SDK (Version 11) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, getDoc, updateDoc, onSnapshot, query, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        // Firebase Config - ตรวจสอบค่าให้ตรงกับของคุณ
        const firebaseConfig = {
            apiKey: "AIzaSyAOXm4aDbToq4ZahlsbgwFz8nfkIviL-bs",
            authDomain: "itdi-fund.firebaseapp.com",
            projectId: "itdi-fund",
            storageBucket: "itdi-fund.firebasestorage.app",
            messagingSenderId: "770219582415",
            appId: "1:770219582415:web:e6c780dd599bb4f7d528ba"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = 'itdi-fund-production';

        window.itdiApp = () => ({
            loading: true,
            isDarkMode: true,
            isSidebarOpen: false,
            activeTab: 'dashboard',
            userData: null,
            loginInput: '',
            config: { currentWeek: 1 },
            students: [],
            transactions: [],
            ledger: [],

            async init() {
                // ระบบจดจำผู้ใช้งาน (Local Storage สำหรับ UI state)
                if(localStorage.getItem('itdi_theme') === 'light') this.isDarkMode = false;
                this.$watch('isDarkMode', val => localStorage.setItem('itdi_theme', val ? 'dark' : 'light'));

                // Firebase Auth
                await signInAnonymously(auth);
                onAuthStateChanged(auth, async (u) => {
                    if (u) {
                        this.syncData();
                    } else {
                        this.userData = null;
                        this.loading = false;
                    }
                });
            },

            syncData() {
                // Sync Config
                onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'config'), (s) => {
                    if (s.exists()) this.config = s.data();
                    this.loading = false;
                }, (err) => { this.showError("Config Error"); this.loading = false; });

                // Sync Students
                onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'students'), (s) => {
                    this.students = s.docs.map(d => ({ id: d.id, ...d.data() }));
                    if (this.userData) {
                        const current = this.students.find(st => st.studentId === this.userData.studentId);
                        if (current) this.userData = current;
                    }
                });

                // Sync Transactions
                onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'transactions'), (s) => {
                    this.transactions = s.docs.map(d => ({ id: d.id, ...d.data() }));
                });

                // Sync Ledger
                onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'ledger'), (s) => {
                    this.ledger = s.docs.map(d => ({ id: d.id, ...d.data() }));
                });
            },

            async login() {
                this.loading = true;
                const sid = this.loginInput.trim();
                const studentRef = doc(db, 'artifacts', appId, 'public', 'data', 'students', sid);
                const snap = await getDoc(studentRef);
                const INITIAL_ADMINS = ['684295024@parichat.skru.ac.th', 'admin'];

                if (snap.exists()) {
                    const data = snap.data();
                    const role = INITIAL_ADMINS.includes(sid) ? 'admin' : (data.role || 'user');
                    await updateDoc(studentRef, { uid: auth.currentUser.uid, role });
                    this.userData = { id: sid, ...data, role };
                } else {
                    const newData = { studentId: sid, uid: auth.currentUser.uid, role: INITIAL_ADMINS.includes(sid) ? 'admin' : 'user', totalPaid: 0 };
                    await setDoc(studentRef, newData);
                    this.userData = newData;
                }
                this.loading = false;
            },

            async logout() {
                await signOut(auth);
                this.userData = null;
                this.loginInput = '';
            },

            getMyTotal() {
                return this.transactions
                    .filter(t => t.studentId === this.userData.studentId && t.status === 'Approved')
                    .reduce((sum, t) => sum + (Number(t.amount) || 0), 0);
            },

            getTotalBalance() {
                return this.ledger.reduce((sum, item) => sum + (Number(item.Income) || 0) - (Number(item.Expense) || 0), 0);
            },

            async updateWeek(val) {
                const configRef = doc(db, 'artifacts', appId, 'public', 'data', 'config');
                await updateDoc(configRef, { currentWeek: Math.max(1, this.config.currentWeek + val) });
            },

            async approve(t) {
                const student = this.students.find(s => s.studentId === t.studentId);
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'transactions', t.id), { status: 'Approved' });
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'students', t.studentId), { 
                    totalPaid: (student.totalPaid || 0) + Number(t.amount) 
                });
            },

            async toggleRole(s) {
                const newRole = s.role === 'admin' ? 'user' : 'admin';
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'students', s.id), { role: newRole });
            },

            showError(msg) {
                // ฟังก์ชันแสดง Error แบบ Custom (แทน alert)
                console.error(msg);
            }
        });
    </script>
